<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCM 460 Kahoot-Style Study Guide</title><style>
:root{--lav:#b99cff;--lav2:#e9ddff;--blue:#bfe8ff;--ink:#26324a;--good:#dff7e8;--bad:#ffe2ea;--card:#ffffffee}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-rounded,system-ui,-apple-system,sans-serif;color:var(--ink);min-height:100vh;background:linear-gradient(135deg,var(--lav2),var(--blue));}.wrap{max-width:920px;margin:auto;padding:28px 18px 60px}header{display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:.2rem 0;font-size:clamp(1.8rem,5vw,3rem)}.pill,button{border:0;border-radius:16px;padding:11px 16px;font-weight:750;cursor:pointer}.pill{background:#ffffffa8}button{background:#7958c7;color:white;box-shadow:0 6px 18px #7050aa33}button.secondary{background:#fff;color:#604c91}.card{background:var(--card);border:1px solid #fff;border-radius:26px;padding:26px;margin-top:20px;box-shadow:0 20px 50px #5c4c8a1f}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.bar{height:10px;background:#fff;border-radius:999px;overflow:hidden;margin:14px 0 24px}.bar>div{height:100%;background:linear-gradient(90deg,#9f7aea,#74c8f4);transition:.3s}.q{font-size:1.35rem;font-weight:800;line-height:1.35}.type{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:#715b9d;font-weight:800}.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.opt{text-align:left;background:#f6f1ff;color:#2d3150;border:2px solid transparent;min-height:64px}.opt:hover{border-color:#a88be7}.opt.selected{border-color:#7252c2;background:#ebe1ff}input,textarea{width:100%;border:2px solid #d7c9f4;border-radius:15px;padding:14px;font:inherit;margin:18px 0;background:#fff}textarea{min-height:110px}.feedback{margin-top:18px;padding:18px;border-radius:18px;line-height:1.5}.feedback.good{background:var(--good)}.feedback.bad{background:var(--bad)}.example{margin-top:10px;padding:12px 14px;background:#ffffffa8;border-radius:12px}.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.score{font-size:1.1rem;font-weight:800}.hidden{display:none}.summary{text-align:center}.summary .big{font-size:4rem;font-weight:900;color:#7155b8}.tiny{font-size:.9rem;color:#5e6680}@media(max-width:650px){.opts{grid-template-columns:1fr}.card{padding:20px}}</style></head><body><div class="wrap"><header><div><div class="pill">SCM 460 • 75-question practice</div><h1>Contracting Study Challenge</h1><div class="tiny">Lavender + light blue • Senior-level MC, fill-in, and short answer • best-answer distractors • explanations + business examples</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">

</div></header><div class="card" id="quiz"><div class="topline"><span id="count" class="pill"></span><span id="score" class="score"></span></div><div class="bar"><div id="progress"></div></div><div id="type" class="type"></div><div id="q" class="q"></div><div id="answerArea"></div><div id="feedback"></div><div class="actions"><button id="submit">Submit answer</button><button id="next" class="hidden">Next →</button></div></div></div><script>
const qs=[{"type": "mc", "q": "Which sequence best matches the contract steps emphasized in class?", "options": ["Requisition → Sourcing → Approval/Negotiation → Execution → Contract Management", "Requisition → Approval → Sourcing/Negotiation → Execution → Contract Management", "Requisition → Sourcing → Execution → Approval/Negotiation → Contract Management", "Sourcing → Requisition → Approval/Negotiation → Execution → Contract Management"], "answer": 0, "explanation": "The course repeatedly presents the lifecycle as requisition, sourcing, approval/negotiation, execution, then contract management.", "business": "A company identifies a need for laptops, sources suppliers, negotiates/approves terms, signs the agreement, then manages supplier performance."}, {"type": "fill", "q": "The document used to define the need and describe the work to be performed is the ________.", "answer": "Statement of Work (SOW)", "alts": ["SOW", "statement of work"], "explanation": "A Statement of Work (SOW) defines the need and the work/services expected from the supplier.", "business": "A facilities contract SOW might specify cleaning areas, frequency, staffing, supplies, and expected outcomes."}, {"type": "mc", "q": "What is a contract?", "options": ["A documented exchange of promises that is enforceable only after performance begins", "An agreement between two or more parties creating a legal obligation to do or not do a particular activity", "A procurement document that becomes binding whenever a buyer issues it, regardless of acceptance", "A written agreement that allocates commercial expectations but does not necessarily create legal obligations"], "answer": 0, "explanation": "Class defines a contract as an agreement between two or more parties creating a legal obligation to do, or not do, a particular activity.", "business": "A buyer and logistics provider sign an agreement requiring weekly deliveries at specified rates."}, {"type": "short", "q": "Name the five foundational requirements for entering a contract.", "answer": "Offer, acceptance, legality of purpose, consideration, and mutuality of obligation.", "keywords": ["offer", "acceptance", "legality", "consideration", "mutuality"], "explanation": "These five elements establish what is proposed, how it is accepted, that the purpose is lawful, what each side gives, and that both sides are bound.", "business": "A supplier offers 1,000 units for $10 each; the buyer accepts; the sale is lawful; goods are exchanged for money; both parties have enforceable duties."}, {"type": "mc", "q": "Which is a benefit of a written contract?", "options": ["It transfers substantially all commercial risk to the supplier", "It protects both parties’ interests by clarifying obligations, allocating risk, and establishing remedies", "It guarantees that the negotiated price represents the lowest available market price", "It eliminates the need for ongoing contract management once the agreement is executed"], "answer": 0, "explanation": "Written contracts protect interests, allocate risk, set expectations and obligations, provide dispute-resolution steps, and can reduce Battle of the Forms.", "business": "A written delivery clause makes it clear who must deliver, where, and by when."}, {"type": "mc", "q": "Battle of the Forms occurs when…", "options": ["The parties negotiate different positions but ultimately execute one integrated agreement", "The buyer and supplier exchange documents containing conflicting terms, such as a PO and sales quote", "The supplier submits multiple bids with materially different commercial assumptions", "The executed contract contains both an SOW and an SLA that address the same service"], "answer": 0, "explanation": "Battle of the Forms refers to conflicting terms in documents exchanged by the parties. A formal negotiated agreement can reduce or eliminate the problem.", "business": "A buyer PO says Net 60 while the seller quote says Net 30; the documents conflict."}, {"type": "mc", "q": "What does an SLA primarily define?", "options": ["The scope, deliverables, and work activities the supplier must perform", "Measurable service-performance expectations and the consequences or credits associated with misses", "The legal hierarchy among conflicting procurement documents", "The criteria used to confirm delivery and authorize payment"], "answer": 0, "explanation": "A Performance/Service Level Agreement sets measurable service expectations and often specifies remedies or credits for misses.", "business": "A website provider promises 99% uptime and gives a credit if it misses the target."}, {"type": "mc", "q": "Which is the best example of an SLA measure from class?", "options": ["Supplier will provide janitorial service at all listed facilities five days per week", "Missed delivery against the contracted service level results in a $50 service credit", "Supplier will invoice monthly using the buyer’s required invoice format", "Supplier warrants that services will conform to the specifications in the agreement"], "answer": 0, "explanation": "The slides use measurable consequences such as a $50 credit for missed delivery and an invoice credit for uptime failure.", "business": "A carrier receives a service credit penalty when on-time delivery drops below the contracted threshold."}, {"type": "short", "q": "Explain the difference between an SOW and an SLA.", "answer": "An SOW defines what work is required; an SLA defines measurable performance/service levels for that work.", "keywords": ["scope", "performance", "service level"], "explanation": "The SOW describes scope and deliverables, while the SLA specifies how well or reliably the service must perform.", "business": "SOW: help-desk coverage and responsibilities. SLA: 95% of priority tickets answered within 15 minutes."}, {"type": "mc", "q": "During sourcing, why is evaluating bids important?", "options": ["To determine which supplier response best satisfies the defined requirements and evaluation approach", "To identify the supplier with the lowest initial price before considering any other requirement", "To finalize contract-management remedies before negotiation begins", "To replace the need for a well-defined SOW by allowing suppliers to propose the scope"], "answer": 0, "explanation": "Bid evaluation is part of moving from a defined need toward a supplier selection using the stated requirements.", "business": "A buyer compares price, technical compliance, delivery capability, and service approach across bids."}, {"type": "fill", "q": "The final step in the recurring contract-steps diagram is Contract ________.", "answer": "Management", "alts": ["management"], "explanation": "After execution, the organization manages the contract throughout its life.", "business": "The contract manager tracks milestones, invoices, compliance, and amendments."}, {"type": "mc", "q": "Which statement best describes consideration?", "options": ["The exchange of something of value by each contracting party", "The requirement that both parties possess identical obligations under the agreement", "The process by which an offer is converted into an executed contract", "The legal requirement that the subject matter of the contract be permissible"], "answer": 0, "explanation": "Consideration is the exchange of value between the parties.", "business": "The buyer pays $100,000 and the supplier provides equipment and installation."}, {"type": "mc", "q": "Which requirement confirms that the transaction itself is lawful?", "options": ["Mutuality of obligation", "Legality of purpose", "Consideration", "Acceptance"], "answer": 0, "explanation": "Legality of purpose means the contract’s objective must be lawful.", "business": "A company can contract for legal consulting services, but not for an unlawful transaction."}, {"type": "mc", "q": "Mutuality of obligation means…", "options": ["Each party must provide consideration of exactly equal economic value", "Both parties are bound by enforceable obligations rather than only one side being committed", "Both parties must accept every term without negotiated exceptions", "Each party must have the same termination rights and liability limits"], "answer": 0, "explanation": "Mutuality means the agreement creates obligations for both parties rather than only one side.", "business": "The supplier must deliver conforming goods and the buyer must pay according to the agreed terms."}, {"type": "mc", "q": "Which contract benefit most directly addresses uncertainty about who bears a loss?", "options": ["Consideration", "Risk allocation", "Mutuality of obligation", "Dispute resolution"], "answer": 0, "explanation": "Written contracts can allocate risk by specifying which party is responsible for particular events or losses.", "business": "A shipping clause states when risk transfers from supplier to buyer."}, {"type": "short", "q": "A buyer PO says Net 60 and the supplier quote says Net 30. What class concept is this?", "answer": "Battle of the Forms.", "keywords": ["battle", "forms"], "explanation": "Conflicting terms in exchanged procurement documents are the classic Battle of the Forms situation.", "business": "The parties can negotiate a master contract that clearly states the controlling payment term."}, {"type": "mc", "q": "A requirement that a supplier maintain 99% website uptime is most naturally part of a…", "options": ["Statement of Work", "Service Level Agreement", "Warranties and Representations", "Acceptance and Delivery provision"], "answer": 0, "explanation": "An uptime target is a measurable service-performance standard, which fits an SLA.", "business": "A SaaS contract might require 99.9% monthly uptime and define service credits for failure."}, {"type": "mc", "q": "Which statement best distinguishes a contract from an informal expectation?", "options": ["A contract creates enforceable legal obligations between the parties", "A contract must contain a detailed SLA to be legally enforceable", "A contract differs from an expectation because it must always be signed by both parties", "A contract is enforceable only when it transfers risk from the buyer to the supplier"], "answer": 0, "explanation": "The defining point in the class is that a contract creates a legal obligation to do or not do a particular activity.", "business": "A signed supply agreement legally commits the supplier to deliver and the buyer to pay."}, {"type": "short", "q": "Why does a strong SOW matter before sourcing?", "answer": "It clearly defines the need and expected work so suppliers can respond to the same requirements.", "keywords": ["define", "need", "work", "requirements"], "explanation": "Defining the need through the SOW gives sourcing a clear basis for supplier responses and later performance expectations.", "business": "If all janitorial bidders receive the same locations, frequencies, and tasks, bids are easier to compare fairly."}, {"type": "mc", "q": "Which item is NOT listed as a benefit of a written contract in the slides?", "options": ["Allocates risk between the parties", "Sets expectations and obligations", "Provides a defined path for resolving disputes", "Guarantees the supplier will achieve its expected profit margin"], "answer": 0, "explanation": "The slides list protection of interests, risk allocation, expectations/obligations, dispute resolution, and reducing Battle of the Forms—not guaranteed supplier profit.", "business": "A contract can set a price and obligations, but it cannot guarantee the supplier will operate profitably."}, {"type": "short", "q": "Give one business reason to include a measurable SLA instead of only a broad service promise.", "answer": "It creates an objective performance standard and a defined consequence/remedy when performance is missed.", "keywords": ["measure", "performance", "credit", "remedy"], "explanation": "Measurable SLAs make performance easier to monitor and enforce than vague promises.", "business": "“Fast delivery” is vague; “98% delivered within two business days, otherwise a service credit applies” is measurable."}, {"type": "mc", "q": "Acceptance provisions primarily describe…", "options": ["The criteria and process for confirming satisfactory delivery and authorizing payment", "The logistics method, destination, and timing by which goods are physically delivered", "The point at which ownership and responsibility for in-transit loss transfer", "The assurances the supplier makes regarding the quality of goods or services"], "answer": 0, "explanation": "Acceptance defines the criteria and steps used to confirm delivered goods/services and authorize payment.", "business": "A buyer tests installed equipment against specifications before formally accepting it and releasing payment."}, {"type": "mc", "q": "Delivery provisions primarily specify…", "options": ["The criteria used to inspect and formally accept completed goods or services", "How delivery is to be made under the agreement", "When title and risk of loss transfer between the parties", "The invoice documentation required before payment is released"], "answer": 0, "explanation": "The class slide states that delivery specifies how delivery is to be made.", "business": "A delivery clause can specify destination, timing, packaging, and required delivery method."}, {"type": "mc", "q": "Risk of Loss/Title addresses…", "options": ["The point at which ownership and responsibility for loss of goods in transit are allocated", "The process for inspecting goods and authorizing payment after delivery", "The party responsible for paying freight charges and submitting invoices", "The remedies available when delivered goods fail a warranty"], "answer": 0, "explanation": "Risk of Loss/Title determines ownership while goods are in transit and who is responsible if loss occurs.", "business": "If goods are damaged in transit, this clause helps determine whether buyer or seller bears the loss."}, {"type": "mc", "q": "An Assignment clause addresses…", "options": ["The conditions under which contractual responsibilities may be transferred to another party", "The priority among conflicting documents incorporated into the contract", "The allocation of liability when a third party asserts a claim", "The process for changing scope through a contract amendment"], "answer": 0, "explanation": "Assignment details the legality/rules for changing the responsible parties under the contract.", "business": "A supplier may need buyer consent before transferring the contract to an acquiring company."}, {"type": "mc", "q": "Terms of Payment addresses…", "options": ["The requirements for invoices and the manner in which payment will be distributed", "The criteria that must be satisfied before goods or services are accepted", "The allocation of ownership while goods are in transit", "The financial remedy established for losses arising from breach"], "answer": 0, "explanation": "Terms of Payment defines invoice requirements and how payment is made/distributed.", "business": "A contract may require itemized invoices and payment Net 45 after an accepted invoice."}, {"type": "mc", "q": "Liquidated Damages are intended to…", "options": ["A pre-established mechanism for making a party whole when breach creates loss that is difficult to define", "A cap on the total damages for which a party may be responsible", "An obligation to defend or hold the other party harmless against specified claims", "A service credit used only when an SLA metric is missed"], "answer": 0, "explanation": "The slide describes liquidated damages as addressing how parties make each other whole when a breach causes undefined loss.", "business": "A construction contract may specify a set daily amount for delay where actual loss is difficult to quantify."}, {"type": "mc", "q": "Termination for cause is used when…", "options": ["The buyer determines the agreement is no longer strategically useful, even without supplier breach", "A breach occurs and the contract specifies steps permitting cancellation on that basis", "An uncontrollable event temporarily prevents performance", "The parties reach the end of the stated contract term"], "answer": 0, "explanation": "Termination for cause defines the steps to cancel a contract when a breach arises.", "business": "Repeated failure to meet a critical delivery obligation may trigger termination-for-cause procedures."}, {"type": "mc", "q": "Termination for convenience allows…", "options": ["Ending the agreement under stated rights even without a supplier breach", "Ending the agreement only after a material breach and failed cure period", "Suspending performance temporarily because of a force-majeure event", "Transferring the agreement to another legal entity with consent"], "answer": 0, "explanation": "Termination for convenience sets the steps necessary to cancel the contract without requiring a breach.", "business": "A buyer’s business strategy changes and it ends the agreement using the convenience clause and required notice."}, {"type": "mc", "q": "Limitation of Liability defines…", "options": ["The maximum or defined amount each party may be responsible for as a result of contract damages", "The categories of third-party claims one party must defend on behalf of the other", "The predetermined amount owed for a specific breach when actual loss is difficult to quantify", "The remedies and escalation steps the parties must use before litigation"], "answer": 0, "explanation": "This clause limits or defines the amount of responsibility for damages resulting from the contract.", "business": "A SaaS agreement may cap certain damages at fees paid during a stated period."}, {"type": "mc", "q": "Indemnification addresses…", "options": ["A party’s obligation to hold the other harmless under specified circumstances", "A cap on the damages either party can recover from the other", "A predetermined payment triggered by a defined breach", "An assurance that the supplier’s goods and services meet stated requirements"], "answer": 0, "explanation": "Indemnification sets requirements for parties to hold the other entity harmless under specified circumstances.", "business": "A supplier may indemnify the buyer for certain third-party claims arising from the supplier’s work."}, {"type": "mc", "q": "Warranties and Representations provide…", "options": ["Assurances concerning the products, services, or factual statements being offered", "A ceiling on recoverable damages arising from the contract", "The procedure for resolving disagreements before litigation", "The conditions under which obligations may be excused by uncontrollable events"], "answer": 0, "explanation": "Warranties and representations are assurances concerning the offered product or service.", "business": "A supplier warrants that equipment conforms to specifications and is free from specified defects."}, {"type": "mc", "q": "Force Majeure addresses…", "options": ["Uncontrollable events or Acts of God that may excuse affected contract activities", "A supplier’s failure to meet an SLA because its staffing plan was inadequate", "A buyer’s right to end the agreement without a breach", "A predetermined remedy for losses that are difficult to calculate"], "answer": 0, "explanation": "The class defines force majeure around Acts of God for which contract parties will not be responsible for contract activities.", "business": "A severe natural disaster may temporarily prevent performance under a force-majeure clause."}, {"type": "mc", "q": "Order of Precedence tells the parties…", "options": ["Which incorporated document governs when procurement documents conflict", "Which party’s interpretation controls when contract language is ambiguous", "Which negotiated issue should be addressed first during bargaining", "Which supplier receives priority when two bids receive the same score"], "answer": 0, "explanation": "Order of Precedence identifies which document takes priority when multiple procurement documents conflict.", "business": "If the master agreement conflicts with an exhibit, the clause may state which one governs."}, {"type": "mc", "q": "Dispute Resolution defines…", "options": ["The agreed process for addressing contractual issues or disputes", "The hierarchy that determines which document controls when terms conflict", "The process for correcting recurring supplier-performance deficiencies", "The right to terminate the contract after a material breach"], "answer": 0, "explanation": "Dispute Resolution establishes the process to follow when contractual issues arise.", "business": "The parties may be required to escalate to executives or mediate before litigation."}, {"type": "short", "q": "List four advanced T&C topics identified in class.", "answer": "Any four: Intellectual Property, Cyber Security, Data Classification, Data Security, Data Use, Confidentiality, EULA, Click Throughs.", "keywords": ["intellectual", "cyber", "data", "confidential", "EULA", "click"], "explanation": "The advanced T&C slide focuses heavily on technology, information, confidentiality, and software-use terms.", "business": "A software procurement may require IP ownership, cybersecurity controls, data-use restrictions, and confidentiality provisions."}, {"type": "mc", "q": "Integrative negotiation primarily focuses on…", "options": ["Expanding total value by exploring interests and possible solutions", "Claiming as much value as possible within a fixed bargaining range", "Protecting a resistance point while using concessions to approach a ZOPA", "Using an aggressive opening anchor to shift the bargaining range"], "answer": 0, "explanation": "Integrative negotiation emphasizes identifying issues, creating value, finding possible solutions, and distinguishing interests from positions.", "business": "Buyer values faster delivery while supplier values longer commitments; they trade across priorities to improve both sides’ outcomes."}, {"type": "mc", "q": "Distributive negotiation is most associated with…", "options": ["Shared goals, trust, interest discovery, and unique solutions that expand total value", "Target point, resistance point, BATNA, zero-sum dynamics, and ZOPA", "Corrective action, notice to cure, SLA monitoring, and contract compliance", "SOW development, bid evaluation, contract execution, and closeout"], "answer": 0, "explanation": "The distributive framework in class includes target/resistance points, BATNA, zero-sum game, and Zone of Possible Agreement.", "business": "Buyer and seller bargain over a fixed price range where each dollar gained by one is a dollar lost by the other."}, {"type": "fill", "q": "BATNA stands for the best alternative to a negotiated ________.", "answer": "agreement", "alts": ["agreement"], "explanation": "BATNA is the alternative you can pursue if the current negotiation does not produce an agreement.", "business": "If a supplier will not meet acceptable terms, the buyer’s BATNA may be contracting with the next-best qualified supplier."}, {"type": "fill", "q": "ZOPA stands for Zone of Possible ________.", "answer": "Agreement", "alts": ["agreement"], "explanation": "ZOPA is the range in which both parties could potentially accept a deal.", "business": "If the buyer can pay up to $110 and seller can accept as low as $100, $100–$110 is the ZOPA."}, {"type": "mc", "q": "In distributive negotiation, an opening offer may function as…", "options": ["A reservation point that defines when the negotiator should walk away", "An anchor that can influence the bargaining range", "A BATNA that replaces the need to define a target point", "A concession that automatically establishes the ZOPA"], "answer": 0, "explanation": "The distributive strategies slide notes that an opening offer may work as an anchor.", "business": "A supplier opens at $120 per unit, influencing the reference point for later bargaining."}, {"type": "mc", "q": "Which is an integrative strategy?", "options": ["Ask questions to uncover interests and identify shared or complementary goals", "Defend your resistance point while pushing the other side toward theirs", "Use the opening offer primarily to anchor the other party’s expectations", "Assume the bargaining pool is fixed and maximize your share of it"], "answer": 0, "explanation": "Integrative strategy emphasizes questions, common goals, trust, and creating value through unique solutions.", "business": "A buyer asks why a supplier needs a higher price and discovers flexible delivery timing could reduce supplier costs."}, {"type": "mc", "q": "Which is a distributive strategy from class?", "options": ["Explore differences in priorities to create trades that increase total value", "Challenge the other party’s resistance point while defending your own", "Focus on long-term trust and common goals before discussing positions", "Bring in another party primarily to create a novel solution that expands value"], "answer": 0, "explanation": "The slides explicitly list challenging the other side’s resistance point while defending your own.", "business": "A buyer tests whether the seller’s claimed minimum price is truly firm while protecting its own maximum."}, {"type": "mc", "q": "A negotiation plan should define…", "options": ["Issues, priorities, alternatives, and objectives before bargaining begins", "Only the opening offer and the minimum acceptable price", "Only the legal clauses the organization refuses to modify", "The supplier’s priorities and resistance point, but not the buyer’s own alternatives"], "answer": 0, "explanation": "The class says to define issues, priorities, alternatives, and objectives, then determine whether the negotiation is integrative or distributive.", "business": "Before negotiating logistics rates, the team ranks price, capacity, lead time, and payment terms and identifies fallback options."}, {"type": "short", "q": "What is the difference between an interest and a position in negotiation?", "answer": "A position is what a party says it wants; an interest is the underlying reason or need driving that position.", "keywords": [], "explanation": "Integrative negotiation looks beneath stated positions to underlying interests, which can reveal value-creating solutions.", "business": "Supplier position: “We need a 5% increase.” Interest: protecting margin from volatile input costs. A price-index mechanism might address the interest."}, {"type": "mc", "q": "Which situation best fits integrative negotiation?", "options": ["The parties value a long-term relationship and place different importance on several negotiable issues", "The parties bargain over one fixed price and each dollar gained by one side is lost by the other", "Each side knows its resistance point and focuses on claiming the largest possible share of a fixed range", "One party uses a strong anchor and plans concessions to move toward the other side’s resistance point"], "answer": 0, "explanation": "Long-term valued relationships, trust, shared goals, and differing priorities are core integrative themes.", "business": "Buyer gives a longer contract term in exchange for improved service levels and lower unit pricing."}, {"type": "mc", "q": "Which phrase best describes a zero-sum game?", "options": ["The parties trade across differently valued issues to expand total value", "One party’s gain corresponds to the other party’s loss within a fixed pool of value", "Both parties improve their outcomes by introducing additional issues into the negotiation", "The parties focus on underlying interests rather than stated positions"], "answer": 0, "explanation": "Zero-sum thinking is associated with distributive negotiation where value is treated as fixed.", "business": "In a single-issue price negotiation, a $1 higher price benefits seller and costs buyer $1."}, {"type": "short", "q": "Why should a negotiator know their BATNA before negotiating?", "answer": "It gives a realistic fallback and helps determine when walking away is better than accepting a poor deal.", "keywords": [], "explanation": "BATNA gives the negotiator an alternative outside the current deal and supports disciplined decision-making.", "business": "A buyer with a qualified backup supplier can reject terms worse than the backup option."}, {"type": "mc", "q": "A supplier says, “Our price is $50 and we will not go below $45.” The $45 figure is closest to its…", "options": ["Target point", "Resistance point", "BATNA", "Opening anchor"], "answer": 0, "explanation": "A resistance point is the boundary beyond which a party will not accept the deal.", "business": "If the supplier cannot profit below $45, that becomes its walk-away boundary."}, {"type": "mc", "q": "The desired outcome a negotiator aims for is closest to the…", "options": ["Target point", "Resistance point", "BATNA", "ZOPA boundary"], "answer": 0, "explanation": "In distributive planning, the target point represents the outcome a party hopes to achieve, distinct from its resistance point.", "business": "A buyer may target $40 per unit but have a maximum acceptable price of $47."}, {"type": "short", "q": "Give one way an integrative negotiator can create value.", "answer": "Trade across issues with different priorities, find shared goals, remove obstacles, or bring in an additional party to bridge gaps.", "keywords": ["trade", "priority", "shared", "solution", "value", "party"], "explanation": "Integrative strategies expand value by solving underlying problems rather than only splitting a fixed amount.", "business": "Buyer cares most about delivery speed; supplier cares most about forecast stability. Better forecasts can enable faster delivery without a large price increase."}, {"type": "mc", "q": "Which behavior may appear in distributive negotiation according to the slides?", "options": ["Intimidation, aggression, or bluffing may be encountered while claiming value", "Openly sharing all reservation information to maximize joint value", "Avoiding concessions because any movement necessarily destroys the ZOPA", "Foc let ctx=null,master=null,timer=null,musicOn=false,currentNodes=[],nextBar=0,step=0;
function initAudio(){
  if(ctx)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=.46;master.connect(ctx.destination);
}
function stopSound(){
  if(timer){clearInterval(timer);timer=null}
  currentNodes.forEach(n=>{try{n.stop()}catch(e){}try{n.disconnect()}catch(e){}});
  currentNodes=[];nextBar=0;step=0;
}
function tone(freq,when,dur,gain,type='sine'){
  let o=ctx.createOscillator(),g=ctx.createGain();

  g.gain.exponentialRampToValueAtTime(Math.max(gain,.0002),when+.02);
  g.gain.exponentialRampToValueAtTime(.0001,when+dur);
  o.connect(g).connect(master);o.start(when);o.stop(when+dur+.03);
}
function kick(t,g=.05){let o=ctx.createOscillator(),a=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(48,t+.16);a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(a).connect(master);o.start(t);o.stop(t+.22)}
function hat(t,g=.008){let b=ctx.createBuffer(1,ctx.sampleRate*.05,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),a=ctx.createGain();s.buffer=b;f.type='highpass';f.frequency.value=5000;a.gain.setValueAtTime(g,t);a.gain.exponentialRampToValueAtTime(.0001,t+.05);s.connect(f).connect(a).connect(master);s.start(t)}
function ambience(kind){
  let b=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  let s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=b;s.loop=true;
  if(kind==='rain'){f.type='highpass';f.frequency.value=1800;g.gain.value=.022}
  else if(kind==='ocean'){f.type='lowpass';f.frequency.value=600;g.gain.value=.05}
  else{f.type='bandpass';f.frequency.value=2500;g.gain.value=.008}
  s.connect(f).connect(g).connect(master);s.start();currentNodes.push(s);
  if(kind==='ocean'){let l=ctx.createOscillator(),lg=ctx.createGain();l.frequency.value=.10;lg.gain.value=.025;l.connect(lg).connect(g.gain);l.start();currentNodes.push(l)}
}

  if(v==='ocean'){[174.61,220,261.63].forEach((f,k)=>tone(f,t+k*1.65,5,.008))}

}
function barLength(v){return ({original:5.4,lavender:5.2,rain:4.8,ocean:5.1,forest:5.0,dream:4.9,disco:4.0,lofi:4.4,boom:4.16,night:4.96})[v]||5}
function scheduler(){
  if(!musicOn)return;

function playSelected(){
